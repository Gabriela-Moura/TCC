<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Ambiental</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    .grafico{
        height: 400px;
        width: 600px;
        display: flex;
        border-radius: 5px;
        padding: 2px;
    }
</style>
</head>
<body>

    <h5>Inserir Dados</h5>
    
    <form id="formDados">
        <div>
            <input
                type="number"
                id="temp"
                placeholder="Temperatura (°C)"
                required
            >
        </div><br>

        <div>
            <input
                type="time"
                id="hora"
                step="3600"
                required
            >
        </div><br>

        <button>Adicionar</button><br><br>
    </form>

    <h2>Tendência nas Últimas 24 Horas</h2>
<div class="grafico">
    <canvas id="grafico"></canvas>
</div>

<script>

const ctx = document.getElementById('grafico');

const dados = [];

const linha = new Chart(ctx, {
    type: 'line',

    data: {
        labels: [],
        datasets: [{
            label: 'Temperatura (°C)',
            data: [],
            borderColor: 'red',
            fill: true,
            backgroundColor: 'pink',
            tension: 0.4,
            pointRadius: 4
        }]
    },
});

function getLabels() {
    return dados.map(d => d.hora);
}

function getTemp() {
    return dados.map(d => d.temp);
}

function atualizarGraficos() {

    linha.data.labels = getLabels();

    linha.data.datasets[0].data = getTemp();

    linha.update();
}

const form = document.getElementById("formDados");

form.addEventListener("submit", function(event){

    event.preventDefault();

    const temp = document.getElementById("temp").value;
    const hora = document.getElementById("hora").value;

    const horaExiste = dados.some(d => d.hora === hora);

    if (horaExiste) {
        alert("Essa hora já foi adicionada!");
        return;
    }

    dados.push({
        hora: hora,
        temp: Number(temp)
    });

    atualizarGraficos();

});

</script>
